[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reinforcement-learning-job-shop-scheduling"
version = "0.1.0"
description = "Masked Transformer PPO for classical Job-Shop Scheduling with exact CP-SAT evaluation."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.3",
  "gymnasium>=1.2",
  "ortools>=9.10",
]

[tool.setuptools.packages.find]
include = ["jssp_rl*"]
